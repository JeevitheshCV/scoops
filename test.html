<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Mascot Video Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #ff92c8 0%, transparent 28%),
        radial-gradient(circle at 80% 25%, #abd8ff 0%, transparent 30%),
        radial-gradient(circle at 50% 80%, #fff1b8 0%, transparent 32%),
        linear-gradient(135deg, #ffe6f1 0%, #e2f2ff 55%, #fff8f0 100%);
      font-family: Arial, sans-serif;
    }

    .test-box {
      width: min(92vw, 720px);
      min-height: 520px;
      padding: 24px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 24px 70px rgba(60, 35, 35, 0.18);
    }

    video {
      display: block;
      width: min(420px, 85vw);
      height: auto;
      object-fit: contain;
      background: transparent;
    }

    .note {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #261a1a;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="test-box">
    <video
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      controls
      aria-label="Scoops ice cream mascot animation"
    >
      <source
        src="./assets/mascot/Ice_Cream_Mascot_Animation.mov"
        type='video/quicktime; codecs="hvc1"'
      />

      Your browser does not support the mascot animation.
    </video>
  </main>

  <div class="note">
    Test: video should autoplay/loop on iPhone Safari. Background is just to make the video area visible.
  </div>
</body>
</html>
