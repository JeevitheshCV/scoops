<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mascot Transparency Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff92c8, #abd8ff, #fff1b8);
      font-family: Arial, sans-serif;
    }

    .stage {
      width: min(900px, calc(100% - 32px));
      min-height: 620px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      border: 3px dashed #7b3448;
      background:
        linear-gradient(45deg, rgba(0,0,0,0.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(0,0,0,0.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.12) 75%),
        linear-gradient(135deg, #ff92c8, #abd8ff, #fff1b8);
      background-size: 40px 40px, 40px 40px, 40px 40px, 40px 40px, 100% 100%;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0, center;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.18);
    }

    video {
      width: min(420px, 80vw);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .note {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.9);
      color: #261a1a;
      font-weight: 800;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video autoplay muted loop playsinline webkit-playsinline controls>
      <source
        src="./assets/mascot/Ice_Cream_Mascot_Animation-1%20copy.mov"
        type='video/quicktime; codecs="hvc1"'
      />

      <source
        src="./assets/mascot/Ice_Cream_Mascot_Animation-webm.webm?v=22"
        type='video/webm; codecs="vp9"'
      />

      Your browser does not support this video.
    </video>
  </div>

  <div class="note">
    Pass = mascot moves and checkerboard is visible around it. Fail = black/white rectangle around mascot.
  </div>
</body>
</html>
